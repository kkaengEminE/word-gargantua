<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Gargantua</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="webgl"></canvas>
  <div id="css2d-container"></div>
  <div id="input-area">
    <input type="text" id="word-input" placeholder="단어를 입력하세요..." autocomplete="off" spellcheck="false" />
    <div id="tag-autocomplete" class="hidden"></div>
  </div>
  <div id="speech-bubble" class="hidden"></div>
  <div id="onboarding-hint">단어를 입력하고 Enter를 누르세요</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
